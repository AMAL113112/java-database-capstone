spring.application.name=smartclinicnew

# =====================================
# DATABASE CONFIGURATION (MySQL)
# =====================================

spring.datasource.url=jdbc:mysql://localhost:3306/cms
spring.datasource.username=amal
spring.datasource.password=amal
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =====================================
# DATABASE CONFIGURATION (MongoDB)
# =====================================

spring.data.mongodb.uri=mongodb://localhost:27017/cms

# =====================================
# Static Resources
# =====================================
spring.web.resources.static-locations=classpath:/static/


# =====================================
# Thymeleaf
# =====================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8