<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/assets/css/adminDashboard.css">
</head>
<body>

    <div id="header"></div>

    <h1>Admin Dashboard</h1>

    <!-- Doctor Search + Filters -->
    <h2>Doctor Management</h2>

    <div class="filter-bar">
        <input id="searchBar" type="text" placeholder="Search doctor by name">

        <select id="filterTime">
            <option value="">All Availability</option>
            <option value="Morning">Morning (09:00 - 12:00)</option>
            <option value="Afternoon">Afternoon (14:00 - 17:00)</option>
        </select>

        <select id="filterSpecialty">
            <option value="">All Specialties</option>
            <option value="Cardiologist">Cardiologist</option>
            <option value="Neurologist">Neurologist</option>
            <option value="Orthopedist">Orthopedist</option>
            <option value="Dermatologist">Dermatologist</option>
            <option value="Pediatrician">Pediatrician</option>
        </select>
    </div>

    <!-- Doctor Cards -->
    <div id="content"></div>

    <!-- Appointment Section -->
    <h2>Appointments</h2>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Appointment ID</th>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Time</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="appointmentTableBody"></tbody>
    </table>

    <!-- Overlay -->
    <div id="modalOverlay" class="modal-overlay" style="display:none;"></div>

    <!-- Add Doctor Modal -->
    <div id="addDoctor" class="modal" style="display:none;">
        <span id="closeDoctorModal" class="close-btn">&times;</span>

        <h3>Add Doctor</h3>

        <input id="doctorName" placeholder="Doctor Name">

        <select id="doctorSpecialty">
            <option value="Cardiologist">Cardiologist</option>
            <option value="Neurologist">Neurologist</option>
            <option value="Orthopedist">Orthopedist</option>
            <option value="Dermatologist">Dermatologist</option>
            <option value="Pediatrician">Pediatrician</option>
        </select>

        <input id="doctorEmail" placeholder="Email">
        <input id="doctorPassword" type="password" placeholder="Password">
        <input id="doctorMobile" placeholder="Mobile">

        <select id="doctorAvailability">
            <option value="Morning">Morning (09:00 - 12:00)</option>
            <option value="Afternoon">Afternoon (14:00 - 17:00)</option>
            <option value="Full Time">Full Time (09:00 - 17:00)</option>
        </select>

        <button onclick="adminAddDoctor()">Save</button>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal" style="display:none;">
        <h3>Delete Doctor</h3>
        <p>Are you sure you want to delete this doctor?</p>

        <div class="modal-actions">
            <button id="confirmDeleteBtn">Delete</button>
            <button id="cancelDeleteBtn">Cancel</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <div id="footer"></div>

    <script src="/js/components/header.js"></script>
    <script src="/js/components/footer.js"></script>
    <script type="module" src="/js/adminDashboard.js"></script>

</body>
</html>
