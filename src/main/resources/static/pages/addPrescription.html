<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Prescription</title>
    <link rel="stylesheet" href="/assets/css/addPrescription.css">
</head>
<body>

    <div id="header"></div>

    <main>
        <h1>Add Prescription</h1>

        <p class="page-description">
            Create a prescription for the patient after consultation.
            Fill in diagnosis, medication, dosage, and doctor notes.
        </p>

        <div class="prescription-card">

            <!-- Auto-filled from doctor dashboard -->
            <input
                type="text"
                id="patientName"
                placeholder="Patient Name"
                readonly
            >

            <input
                type="number"
                id="appointmentId"
                placeholder="Appointment ID"
                readonly
            >

            <!-- Doctor fills these -->
            <input
                type="text"
                id="diagnosis"
                placeholder="Diagnosis"
                required
            >

            <input
                type="text"
                id="medication"
                placeholder="Medication"
                required
            >

            <input
                type="text"
                id="dosage"
                placeholder="Dosage"
                required
            >

            <textarea
                id="doctorNotes"
                placeholder="Doctor Notes"
            ></textarea>

            <button
                type="button"
                onclick="savePrescription()"
            >
                Save Prescription
            </button>

            <button
                type="button"
                onclick="goBack()"
            >
                Back
            </button>
        </div>
    </main>

    <div id="footer"></div>

    <script src="/js/components/header.js"></script>
    <script src="/js/components/footer.js"></script>
    <script src="/js/addPrescription.js"></script>

    <script>
        function goBack() {
            window.location.href =
                "/pages/doctorDashboard.html";
        }
    </script>

</body>
</html>
